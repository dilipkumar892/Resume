<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative rings -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.18">
    <circle cx="1010" cy="120" r="150"/>
    <circle cx="1010" cy="120" r="220" stroke-opacity="0.1"/>
    <circle cx="120" cy="540" r="120"/>
    <circle cx="120" cy="540" r="190" stroke-opacity="0.1"/>
  </g>

  <!-- Subtle grid -->
  <g stroke="#64748b" stroke-opacity="0.08">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Badge -->
  <g>
    <rect x="72" y="120" width="220" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="182" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#c4b5fd" text-anchor="middle">IT SUPPORT &amp; DESKTOP ENGINEER</text>
  </g>

  <!-- Name -->
  <text x="72" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#f8fafc">Dileep Kumar Bardhan</text>

  <!-- Title -->
  <text x="74" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="600" fill="url(#accent)">Desktop Support Engineer</text>

  <!-- Description -->
  <text x="74" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#94a3b8">System Administration · Hardware Troubleshooting · End-User Support</text>

  <!-- Divider -->
  <rect x="74" y="440" width="140" height="6" rx="3" fill="url(#accent)"/>

  <!-- Contact row -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">
    <text x="74" y="500">✉ dilipkumar8923@outlook.com</text>
    <text x="74" y="545">✆ +91-6395019361</text>
    <text x="74" y="590">📍 Noida, Uttar Pradesh, India</text>
  </g>

  <!-- Avatar circle -->
  <circle cx="960" cy="440" r="110" fill="#0f172a" fill-opacity="0.6" stroke="#a855f7" stroke-opacity="0.6" stroke-width="3"/>
  <text x="960" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" text-anchor="middle">DKB</text>
</svg>

